services:
  - type: web
    name: personal-growth-os
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NTFY_TOPIC
        value: topic_workbuddy
      - key: WEB_URL
        sync: false
