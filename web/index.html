<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Today · Personal Growth OS</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="/static/icon-192.png">

<style>
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}60%{transform:translate(-50%,-50%) scale(1.08)}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
</style>
</head>
<body>
<nav class="nav">
  <div class="logo">Personal Growth OS<small>DAILY GROWTH</small></div>
  <div class="tabs"><a href="/" class="on">Today</a><a href="/overview">总览</a><a href="/reviews">Reviews</a></div>
</nav>

<!-- 主界面（免登录，直接使用） -->
<div id="mainView" class="app">
  <div class="hero">
    <div class="date" id="dateStr"></div>
    <h1>Today</h1>
    <div class="bar"><i id="bar" style="width:0%"></i></div>
    <div class="pct"><span id="pct">0%</span><span id="cnt">0 / 0</span></div>
    <div class="nextup" id="nextup" style="display:none"></div>
  </div>

  <div class="addbox">
    <div class="label">＋ 添加临时任务</div>
    <div class="row">
      <input id="nlInput" placeholder="明天买洗衣液 / 周六 14:00 看房 / 周五之前改简历" autocomplete="off">
      <button onclick="addTask()">添加</button>
    </div>
    <div class="hint">支持：明天 · 后天 · 周六 · 这周末 · X月X日 · 今晚8点 · 晚上7点半</div>
  </div>

  <div class="where">
    <div class="wt">📍 当前位置（只随真实执行推进）</div>
    <div id="where"></div>
  </div>

  <div class="sec-title">长期任务 <span class="n" id="nLong">0</span></div>
  <div id="longTasks"></div>
  <div class="sec-title">临时任务 <span class="n" id="nTemp">0</span></div>
  <div id="tempTasks"></div>

  <footer>Personal Growth OS · 长期计划=路线图 · 执行记录=当前位置<br>未完成≠取消 · 最低剂量仅你主动要求时启用</footer>
</div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const ST={pending:'⬜未开始',in_progress:'🟡进行中',completed:'✅已完成',postponed:'⏸️延期'};
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)};
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

load();

async function load(){
  const r=await fetch('/api/today');const d=await r.json();
  window.__today=d.date;
  $('dateStr').textContent=fmtDate(d.date);
  $('bar').style.width=d.progress.pct+'%';
  $('pct').textContent=d.progress.pct+'% 今日进度';
  $('cnt').textContent=`${d.progress.done} / ${d.progress.total} 已完成`;
  const nu=d.nextup;
  $('nextup').style.display=nu?'':'none';
  if(nu)$('nextup').innerHTML='▸ 下一项：<b>'+esc(nu.title)+'</b>'+(nu.duration?' · 预计 '+nu.duration:'');

  $('where').innerHTML=d.plans.map(p=>{
    const hasPos = p.cur_week!=null||p.cur_topic||p.cur_unit;
    let pos=[];
    if(p.cur_week!=null)pos.push(p.id==='english'?'主题周'+p.cur_week:'Week '+p.cur_week);
    if(p.cur_day!=null)pos.push('Day '+p.cur_day);
    let line=pos.join(' · ');
    const f=p.cur_topic||p.cur_unit;if(f)line+=' —— '+esc(f);
    const cp=p.next_cp?`<div class="wr"><b>检查点</b><span>${esc(p.next_cp)}</span></div>`:'';
    // 日期区间 + 剩余天数
    let periodHtml='';
    const per=p.period;
    if(per&&per.end){
      const short=(s)=>s?s.slice(5):'';
      periodHtml=`<div class="wr"><b>周期</b><span>${short(per.start)} ~ ${short(per.end)} · 还剩 <b style="color:#fbbf24">${per.remaining}</b> 天</span></div>`;
    }
    if(!hasPos&&!periodHtml)return '';
    return `<div class="wr"><b>${esc(p.name)}</b><span>${line||'进行中'}</span></div>`+periodHtml+cp;
  }).join('')||'<div class="wr"><span>暂无进度</span></div>';

  const long=d.tasks.filter(t=>t.type==='long_term'),temp=d.tasks.filter(t=>t.type==='temporary');
  $('nLong').textContent=long.length;$('nTemp').textContent=temp.length;
  $('longTasks').innerHTML=long.map(t=>card(t)).join('')||'<div class="empty">今日无长期任务</div>';
  $('tempTasks').innerHTML=temp.map(t=>card(t)).join('')||'<div class="empty">暂无临时任务</div>';
  if(d.progress.total>0&&d.progress.done===d.progress.total)celebrate();
}

function card(t){
  // 今日
  const td=window.__today;
  // 状态标签
  const chips=[`<span class="st ${t.status}">${ST[t.status]}</span>`];
  if(t.plan_id)chips.push(`<span class="chip plan">${t.plan_id}</span>`);
  if(t.priority==='high')chips.push('<span class="chip warn">优先·检查点</span>');
  if(t.duration)chips.push(`<span class="chip">${t.duration}</span>`);
  if(t.scheduled)chips.push(`<span class="chip time">${t.scheduled}</span>`);
  if(t.due_date)chips.push(`<span class="chip due">截止 ${t.due_date}</span>`);
  if(t.level==='minimum')chips.push('<span class="chip lvl">🟡最低剂量</span>');
  // 红绿 + 数字
  let stateTag='';
  const doneCss = t.status==='completed';
  if(doneCss){
    const cd = t.completed_at ? t.completed_at.slice(0,10) : '';
    stateTag=`<span class="chip doneTag">✅ ${cd||'已完成'}</span>`;
  }else{
    // 计算拖了几天（原定日期到今天）
    let days=0;
    if(t.task_date&&td){
      const dd=new Date(t.task_date+'T00:00:00');
      const tt=new Date(td+'T00:00:00');
      days=Math.round((tt-dd)/86400000);
    }
    if(days<0)days=0;
    stateTag=days>0 ? `<span class="chip lateTag">🔴 已拖 ${days} 天</span>`
                     : `<span class="chip dueTag">今日待办</span>`;
  }
  chips.push(stateTag);
  let ops='';
  if(t.status==='pending')ops=`<button class="btn p" onclick="op('${t.id}','in_progress')">开始做</button><button class="btn g" onclick="op('${t.id}','completed')">完成</button><button class="btn w" onclick="op('${t.id}','postponed')">推迟</button>`;
  else if(t.status==='in_progress')ops=`<button class="btn g" onclick="op('${t.id}','completed')">完成</button><button class="btn w" onclick="op('${t.id}','postponed')">推迟</button>`;
  else if(t.status==='postponed')ops=`<button class="btn p" onclick="op('${t.id}','pending')">重新入队</button>`;
  if(t.status==='completed')ops=`<button class="btn" onclick="op('${t.id}','pending')">撤销完成</button>`;
  const borderCss = doneCss ? 'done' : (t.status==='postponed'?'late':'');
  return `<div class="task ${borderCss}"><div class="tt">${esc(t.title)}</div><div class="tm">${chips.join('')}</div>${t.notes?`<div class="tn">${esc(t.notes)}</div>`:''}<div class="ops">${ops}</div></div>`;
}

async function op(id,status){
  const r=await fetch(`/api/tasks/${id}/status`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});
  const d=await r.json();
  if(d.advanced)toast('✓ 已完成 · 当前位置已前移（明天从这里继续）');
  else toast('✓ 已更新');
  load();
}

async function addTask(){
  const v=$('nlInput').value.trim();if(!v)return;
  const r=await fetch('/api/task',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:v})});
  const d=await r.json();
  if(d.ok){const t=d.task;toast(`✓ 已添加：${t.title} ${t.task_date}`);$('nlInput').value='';load()}
  else toast('添加失败');
}
$('nlInput').addEventListener('keydown',e=>{if(e.key==='Enter')addTask()});

function fmtDate(s){const d=new Date(s+'T00:00:00');return `${d.getMonth()+1}月${d.getDate()}日 · 周${'日一二三四五六'[d.getDay()]}`}

/* ===== 🎉 全部完成庆祝特效 ===== */
const CHEERS=['该做的都落地了，剩下的时间理直气壮地休息','100% 完成率，这就是复利的样子','你今天赢过了昨天的自己','又向 IELTS 6.5 和 FAE 走近了一步','坚持的人不多，今天你是其中之一'];
function celebrate(){
  const cv=document.createElement('canvas');
  cv.width=innerWidth;cv.height=innerHeight;
  cv.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:999';
  document.body.appendChild(cv);
  const cx=cv.getContext('2d');
  const colors=['#f7b731','#eb3b5a','#3867d6','#20bf6b','#8854d0','#fd9644'];
  const P=[];
  for(let i=0;i<130;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.6,
    w:5+Math.random()*7,h:8+Math.random()*9,c:colors[i%colors.length],
    vy:2+Math.random()*3,vx:-1.5+Math.random()*3,r:Math.random()*Math.PI,vr:-.12+Math.random()*.24});
  const t0=performance.now();
  (function tick(t){
    cx.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.025;p.r+=p.vr;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
      cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
    if(t-t0<4500)requestAnimationFrame(tick);else cv.remove();
  })(t0);
  const b=document.createElement('div');
  b.style.cssText='position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);z-index:1000;background:linear-gradient(135deg,#111827,#1f2937);color:#fff;padding:24px 30px;border-radius:18px;text-align:center;box-shadow:0 12px 44px rgba(0,0,0,.45);animation:pop .55s;max-width:86vw;border:1px solid rgba(251,191,36,.4)';
  b.innerHTML='<div style="font-size:36px">🎉🏆</div>'
    +'<div style="font-size:21px;font-weight:800;color:#fbbf24;margin:8px 0 6px">今日全部完成！</div>'
    +'<div style="font-size:14px;color:#9ca3af;line-height:1.5">'+CHEERS[Math.floor(Math.random()*CHEERS.length)]+'</div>';
  document.body.appendChild(b);
  setTimeout(()=>{b.style.transition='opacity .7s';b.style.opacity=0;setTimeout(()=>b.remove(),750)},3800);
}
</script>
</body>
</html>
